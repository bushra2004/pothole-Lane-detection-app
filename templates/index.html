<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Road Detection</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      background: url('/static/images/car.jpg') no-repeat center center/cover;
      background-attachment: fixed;
      color: white;
    }
    header {
      position: fixed; top: 0; left: 0; width: 100%; padding: 20px 50px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0, 0, 0, 0.8); z-index: 100;
    }
    nav { display: flex; justify-content: space-between; width: 100%; }
    .logo { font-size: 20px; font-weight: 600; color: #ff4c4c; }
    nav ul { list-style: none; display: flex; }
    nav ul li { margin: 0 15px; }
    nav ul li a { text-decoration: none; color: white; font-weight: 400; font-size: 18px; }
    nav ul li a.active { border-bottom: 2px solid red; }
    .hero {
      position: relative; width: 100%; height: 100vh;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .overlay { position: absolute; width: 100%; height: 115%; background: rgba(0, 0, 0, 0.5); }
    .content { position: relative; max-width: 800px; z-index: 2; }
    h1 { font-size: 36px; font-weight: 600; text-transform: uppercase; }
    .container {
      background: white; color: black; width: 50%; margin: 50px auto;
      padding: 20px; border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .container h1 { color: #333; }
    input[type="file"] { margin: 15px 0; }
    .radio-group { margin: 15px 0; }
    .radio-group label { margin-right: 10px; font-size: 16px; }
    button {
      background-color: #007bff; color: white; border: none;
      padding: 10px 20px; font-size: 16px;
      border-radius: 5px; cursor: pointer; transition: background 0.3s;
    }
    button:hover { background-color: #0056b3; }
    #videoContainer, #processedVideoContainer {
      margin-top: 20px; display: none;
    }
    video {
      width: 100%; max-width: 500px;
      border-radius: 10px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    #loading { display: none; margin-top: 10px; font-size: 16px; color: #007bff; }
    @media (max-width: 768px) {
      .container { width: 90%; }
      header { padding: 15px 20px; }
    }
  </style>
  <script>
    function previewVideo(event) {
      const file = event.target.files[0];
      const videoContainer = document.getElementById("videoContainer");
      const videoElement = document.getElementById("uploadedVideo");

      if (file) {
        const fileURL = URL.createObjectURL(file);
        videoElement.src = fileURL;
        videoContainer.style.display = "block";
        videoElement.onloadeddata = () => URL.revokeObjectURL(fileURL);
      }
    }

    async function uploadVideo() {
      const fileInput = document.getElementById("videoFile");
      const processType = document.querySelector('input[name="process_type"]:checked').value;
      const loading = document.getElementById("loading");
      const processedVideoContainer = document.getElementById("processedVideoContainer");
      const processedVideoElement = document.getElementById("processedVideo");

      if (!fileInput.files.length) {
        alert("Please select a file!");
        return;
      }

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("process_type", processType);

      loading.style.display = "block";
      processedVideoContainer.style.display = "none";

      try {
        const response = await fetch('/upload', {
          method: "POST",
          body: formData
        });

        const data = await response.json();
        loading.style.display = "none";

        if (data.video_url) {
            const videoUrl = data.video_url;  // Timestamp already included by Flask

          processedVideoElement.src = videoUrl;
          processedVideoContainer.style.display = "block";
        } else {
          alert("Error: " + (data.error || "Unknown error occurred"));
        }
      } catch (error) {
        loading.style.display = "none";
        console.error("Error:", error);
        alert("An error occurred while processing the video.");
      }
    }
  </script>
</head>
<body>
  <header>
    <nav>
      <div class="logo">AI Car using Deep Learning</div>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/pothole" class="active">Pothole</a></li>
      </ul>
    </nav>
  </header>

  <section class="hero">
    <div class="overlay"></div>
    <div class="content">
      <h1>AI CAR WITH REAL-TIME DETECTION OF DAMAGED ROADS & LANE DETECTION</h1>
    </div>
  </section>

  <div class="container">
    <h1>Upload Video</h1>
    <input type="file" id="videoFile" accept="video/*" onchange="previewVideo(event)">

    <div class="radio-group">
      <label><input type="radio" name="process_type" value="lane" checked> Lane Detection</label>
      <label><input type="radio" name="process_type" value="damage"> Damage Detection</label>
    </div>

    <button onclick="uploadVideo()">Upload</button>
    <p id="loading">Processing... Please wait.</p>

    <div id="videoContainer">
      <h2>Uploaded Video</h2>
      <video id="uploadedVideo" controls preload="metadata"></video>
    </div>

    <div id="processedVideoContainer">
      <h2>Processed Video</h2>
      <video id="processedVideo" controls preload="metadata"></video>
    </div>
  </div>
</body>
</html>
